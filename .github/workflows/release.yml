# Release — tag 推送自动出产物与校验和(流程见 RELEASE.md)。
name: release

on:
  push:
    tags: ["v*.*.*"]

# Workflow-level default: read-only. The build jobs (`linux-windows`,
# `macos-arm64`) only upload artifacts — they don't need write access
# to the repo. Only the `release` job overrides to `contents: write`
# for the softprops step. `id-token: write` is intentionally not
# granted — no step uses a federated OIDC token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Release runs must NOT cancel each other: every artefact is needed for
# the SHA-256 + identity verification + release draft, so a retried run
# simply produces fresh artefacts (and we dedupe by tag).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Linux + Windows 一起在 ubuntu 上出。Windows 走 docker buildx 交叉,
  # Linux 走 host cargo build, 输出物全部入 dist/, 由 release job 汇总。
  linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need full history so a tag-driven build can resolve the exact
          # commit the artefact was cut from; default shallow clone drops it.
          fetch-depth: 0

      # Bake the tag commit (and any `-dirty` marker from local dev) into
      # both the Windows PE and the Linux ELF so `quiver --version` answers
      # "which commit is this?" without an external manifest. $GITHUB_SHA is
      # the tag's commit when the run is triggered by `v*.*.*` push.
      - name: Record commit identity
        id: identity
        run: |
          echo "sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      # 1) Windows PE: docker 多阶段交叉编译(与 make windows 同链路)。
      - uses: docker/setup-buildx-action@v4
      - name: Cross-compile the Windows PE
        run: |
          docker buildx build --target artifact \
            --build-arg QUIVER_GIT_SHA=${{ steps.identity.outputs.sha }} \
            --build-arg QUIVER_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --output type=local,dest=dist .
          mv dist/quiver.exe dist/quiver-x86_64-pc-windows-gnu.exe

      # 2) Linux binary: 本机编译(release profile 已 opt-level=z/lto/strip)。
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the Linux binary
        env:
          QUIVER_GIT_SHA: ${{ steps.identity.outputs.sha }}
          QUIVER_BUILD_TIME: ${{ github.event.repository.updated_at }}
        run: |
          cargo build --release --locked
          cp target/release/quiver dist/quiver-x86_64-unknown-linux-gnu

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-windows
          if-no-files-found: error
          path: |
            dist/quiver-x86_64-pc-windows-gnu.exe
            dist/quiver-x86_64-unknown-linux-gnu

  # macOS arm64: M 系列 Mac 用。GitHub-hosted macos-14 runner 本来就是 arm64,
  # 不需要 osxcross/lipo 也不需要 qemu; 走 host cargo build --release 即可。
  # 与 macos-13 同架构, 仅 SDK 新一点; 不出 intel 版是设计上不覆盖 Rosetta 用户。
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the macOS binary
        env:
          QUIVER_GIT_SHA: ${{ github.sha }}
          QUIVER_BUILD_TIME: ${{ github.event.repository.updated_at }}
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/quiver \
             dist/quiver-aarch64-apple-darwin
          # Mach-O 没了 linker-strip, strip 一次把符号表清掉, 体积与 Linux 一致。
          strip dist/quiver-aarch64-apple-darwin

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          if-no-files-found: error
          path: dist/quiver-aarch64-apple-darwin

  # 等所有出产物 job 跑完, 汇总算校验和 + 推 release。Draft = 人审完才
  # publish, draft 链接在 CI 日志和 step summary 都有; v0.3.0 的 publish
  # 步骤是 RELEASE.md §"发布说明" 那一步。
  release:
    needs: [linux-windows, macos-arm64]
    runs-on: ubuntu-latest
    # softprops/action-gh-release writes the GitHub Release; every other
    # step in this job is read-only on the repo. (An earlier
    # 'id-token: write' is intentionally absent: the attest step it
    # was added for was removed when the action failed with 403 on
    # GITHUB_TOKEN; see the comment above the Release step. The
    # Release step itself uses actions/github-script which calls the
    # REST API via the workflow's GITHUB_TOKEN; `contents: write` is
    # the only permission needed for release + asset upload.)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten + checksums
        run: |
          cd dist
          # upload-artifact 解出来是 linux-windows/quiver-..., macos-arm64/quiver-...
          # 这种嵌套, 平铺到 dist/ 顶层再算校验和。
          find . -mindepth 2 -type f -exec mv -t . {} +
          # mv 只搬文件不搬目录, 顶层空目录留着会让 `sha256sum *` 撞上 "Is a directory"。
          # 先 `-empty` 删空的, 再 `-mindepth 1` 兜底删(即便残留非空也强制清)。
          find . -mindepth 1 -depth -type d -empty -delete
          sha256sum * > sha256sums.txt
          ls -l
          cat sha256sums.txt

      - name: Verify baked identity
        # Every artefact must carry the same `--version` line and a tag
        # commit equal to $GITHUB_SHA; a drift between Cargo.toml and the
        # tag (or a builder that ignored QUIVER_GIT_SHA) fails here
        # instead of slipping through with matching checksums.
        #
        # The check uses `strings | grep` rather than executing the
        # binary, because this job runs on ubuntu-latest — executing
        # the macOS arm64 or Windows PE artefacts here would fail with
        # "exec format error", masking the actual identity drift we want
        # to detect. The `--version` output lives in the binary's
        # read-only data section as `&'static str` constants, so
        # `strings` finds them reliably on any platform.
        run: |
          expected_sha="${GITHUB_SHA}"
          expected_version="$(awk -F'\"' '/^version =/ {print $2; exit}' Cargo.toml)"
          for bin in \
              quiver-x86_64-pc-windows-gnu.exe \
              quiver-x86_64-unknown-linux-gnu \
              quiver-aarch64-apple-darwin; do
            if ! strings "dist/$bin" | grep -qF "$expected_sha"; then
              echo "::error::$bin does not embed SHA ${expected_sha}"
              exit 1
            fi
            if ! strings "dist/$bin" | grep -qF "$expected_version"; then
              echo "::error::$bin does not embed version ${expected_version}"
              exit 1
            fi
            echo "$bin → baked identity OK (sha=${expected_sha:0:7}, version=${expected_version})"
          done

      # Provenance is established by (1) the SHA-256 in sha256sums.txt,
      # (2) `git verify-tag vX.Y.Z` on the signed tag, and (3) the
      # tag-commit binding baked into every binary's --version line
      # (the previous step). That is the level SLSA Build L1 needs.
      #
      # SLSA Build L2 in addition wants a signed in-toto attestation
      # bound to the workflow's OIDC identity. GitHub's first-party
      # `actions/attest-build-provenance@v2` would provide that, but
      # it needs a token with `attestations:write` — the workflow's
      # default `GITHUB_TOKEN` cannot create attestations on personal
      # repos today, and granting a PAT is a separate security review.
      # The trade-off is documented in RELEASE.md; the upgrade path
      # is a one-line `uses: actions/attest-build-provenance@v2`
      # once the repo gains an OIDC-enabled token.

      - name: Release
        # Use the `gh` CLI directly rather than softprops or any third-
        # party action. The CLI is pre-installed on GitHub-hosted ubuntu
        # runners and authenticates with the workflow's GITHUB_TOKEN
        # via GH_TOKEN. Every API call is logged as a CLI command —
        # a failure shows up as a non-zero exit, not as a silent 0
        # from a black-box action.
        #
        # The "delete existing draft for this tag then re-create" pair
        # makes re-runs idempotent: a retry of this workflow (e.g. after
        # editing the workflow file) drops the previous draft and
        # uploads a fresh one with the latest binaries, instead of
        # failing on `gh release create ... already exists`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          echo "deleting any pre-existing draft for ${tag}"
          gh release delete "${tag}" --cleanup-tags --yes || true
          echo "creating draft release for ${tag}"
          gh release create "${tag}" \
              --draft \
              --generate-notes \
              --title "${tag}" \
              dist/quiver-x86_64-pc-windows-gnu.exe \
              dist/quiver-x86_64-unknown-linux-gnu \
              dist/quiver-aarch64-apple-darwin \
              dist/sha256sums.txt
          echo "release draft created at https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag} (draft — publish manually)"
