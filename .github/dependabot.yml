# Dependabot 依赖更新(CNCF 维护方式: 依赖自动化、评审人工化)。
# Rust 依赖走 cargo; GitHub Actions 依赖走 github-actions。
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    # MSRV 是契约(Cargo.toml rust-version = 1.91):
    # 任何把 MSRV 顶过它的依赖更新都会被 CI 的 msrv job 拦下。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies", "ci"]
    # dtolnay/rust-toolchain 的 version 字段被 dependabot 当成 Rust 版本号比对,
    # 但它的 tag/版本命名(1.x.y) 与 Rust 自身 minor 完全脱钩, dependabot 会提
    # 出根本不存在的 Rust release(例: 1.120), 让 CI 的 rustup 直接 404。
    # 工具链 bump 走人工评审, 改 rust-toolchain 文件 + Dockerfile RUST_IMAGE 两处。
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
